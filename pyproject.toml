[project]
name = "insightflow-ai"
version = "0.1.0"
description = "Secure, local-first agentic business intelligence analyst."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1", "langgraph>=0.2,<1",
  "pandas>=2.2,<3", "plotly>=5.24,<7", "pyarrow>=17,<20", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlglot>=25,<28", "streamlit>=1.39,<2", "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["bandit>=1.7", "mypy>=1.11", "pandas-stubs>=2.2", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["unit", "integration", "security", "e2e", "performance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"] # Ruff's formatter is the canonical wrapping rule; long SQL/CSS literals remain readable.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["insightflow"]

[tool.coverage.run]
source = ["insightflow"]

[tool.setuptools.packages.find]
where = ["src"]
